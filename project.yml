name: PhotoAlbumPlayer
options:
  bundleIdPrefix: com.yourcompany
  deploymentTarget:
    iOS: 16.0
  xcodeVersion: "15.0"

targets:
  PhotoAlbumPlayer:
    type: application
    platform: iOS
    sources:
      - Sources
    settings:
      base:
        INFOPLIST_FILE: ""
        PRODUCT_BUNDLE_IDENTIFIER: com.yourcompany.photoalbumplayer
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: ""
    info:
      path: Info.plist
      properties:
        CFBundleName: "相册播放"
        CFBundleDisplayName: "相册自动播放"
        CFBundleVersion: "1"
        CFBundleShortVersionString: "1.0"
        UIApplicationSupportsIndirectInputEvents: YES
        UILaunchStoryboardName: LaunchScreen
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSPhotoLibraryUsageDescription: "我们需要访问您的相册以显示照片"
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
    dependencies: []